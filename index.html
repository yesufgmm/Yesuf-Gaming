<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YESUF GAMING</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Tajawal",sans-serif;
    background:#0b0b0f;
    color:#fff;
}

/* HEADER */

header{
    background:#111116;
    border-bottom:1px solid #24242c;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:25px;
    font-weight:800;
}

.logo span{
    color:#7c5cff;
}

/* HERO */

.hero{
    max-width:1200px;
    margin:auto;
    padding:75px 20px 45px;
    text-align:center;
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero h1 span{
    color:#7c5cff;
}

.hero p{
    color:#9999a3;
    font-size:17px;
}

/* CATEGORIES */

.categories{
    max-width:1100px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.category{
    position:relative;
    height:250px;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #292934;
    background:#15151b;
    text-decoration:none;
    color:white;
    display:flex;
    align-items:flex-end;
    transition:0.25s;
}

.category:hover{
    transform:translateY(-6px);
    border-color:#7c5cff;
}

.category img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    inset:0;
    opacity:.55;
    transition:.25s;
}

.category:hover img{
    opacity:.7;
    transform:scale(1.04);
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 25%,
        rgba(0,0,0,.9) 100%
    );
}

.category-content{
    position:relative;
    z-index:2;
    padding:25px;
}

.category-content h2{
    font-size:27px;
    margin-bottom:5px;
}

.category-content p{
    color:#c0c0c7;
    font-size:14px;
}

/* FOOTER */

footer{
    margin-top:70px;
    padding:30px 20px;
    text-align:center;
    border-top:1px solid #24242c;
    background:#111116;
    color:#777780;
    font-size:13px;
}

/* MOBILE */

@media(max-width:800px){

    .categories{
        grid-template-columns:1fr;
    }

    .category{
        height:210px;
    }

    .hero{
        padding:50px 20px 30px;
    }

    .hero h1{
        font-size:32px;
    }

}

</style>
</head>

<body>

<header>

    <div class="nav">

        <a href="#" class="logo">
            YESUF <span>GAMING</span>
        </a>

    </div>

</header>


<section class="hero">

    <h1>
        مرحبًا بك في <span>YESUF GAMING</span>
    </h1>

    <p>
        اختر القسم الذي تريد تصفحه 🎮
    </p>

</section>


<section class="categories">

    <!-- PC -->

    <a href="#" class="category">

        <img
        src="https://placehold.co/1280x720/17171d/ffffff?text=PC+GAMES"
        alt="PC Games">

        <div class="overlay"></div>

        <div class="category-content">

            <h2>🖥️ PC Games</h2>

            <p>ألعاب الكمبيوتر</p>

        </div>

    </a>


    <!-- ANDROID -->

    <a href="#" class="category">

        <img
        src="https://placehold.co/1280x720/17171d/ffffff?text=ANDROID+GAMES"
        alt="Android Games">

        <div class="overlay"></div>

        <div class="category-content">

            <h2>📱 Android Games</h2>

            <p>ألعاب الهواتف والأجهزة المحمولة</p>

        </div>

    </a>


    <!-- ROMS -->

    <a href="#" class="category">

        <img
        src="https://placehold.co/1280x720/17171d/ffffff?text=ROMS"
        alt="ROMs">

        <div class="overlay"></div>

        <div class="category-content">

            <h2>💿 ROMs</h2>

            <p>ألعاب المحاكيات والمنصات القديمة</p>

        </div>

    </a>

</section>


<footer>

    © 2026 YESUF GAMING

</footer>

</body>
</html>
