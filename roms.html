<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0b0b0f;
    color:white;
    font-family:"Tajawal",sans-serif;
}

header{
    background:#111116;
    border-bottom:1px solid #24242c;
    padding:18px 20px;
}

.logo{
    max-width:1100px;
    margin:auto;
}

.logo a{
    color:white;
    text-decoration:none;
    font-size:25px;
    font-weight:800;
}

.logo span{
    color:#7c5cff;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:45px 20px;
}

h1{
    margin-bottom:25px;
}

.games{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.game-card{
    width:300px;
    background:#15151b;
    border:1px solid #292934;
    border-radius:14px;
    overflow:hidden;
    text-decoration:none;
    color:white;
    transition:0.2s;
}

.game-card:hover{
    transform:translateY(-5px);
    border-color:#7c5cff;
}

.game-card img{
    width:100%;
    height:400px;
    object-fit:contain;
    background:#111116;
    display:block;
}

.game-info{
    padding:15px;
}

.game-info h2{
    font-size:19px;
    margin-bottom:6px;
}

.game-info p{
    color:#9999a3;
}
